onboarding = false

[theme]
name = "catppuccin"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false
status_indicators = "symbols"

[ui.sidebar.spaces]
row_gap = 0
rows = [
    ["state_icon", "workspace"],
    ["branch", "git_status"],
]

[ui.sidebar.agents]
row_gap = 0
rows = [
    ["state_icon", "machine", "workspace", "tab"],
    ["agent"],
]

[ui.toast]
delivery = "terminal"
